# ---------------------------------------------------------------------------
# Entwickler- und CI-Konfiguration.
#
# Diese Datei aendert NICHTS an der Installation fuer Anwender: Die Skripte
# 'protokoll_assistent/Einrichtung-Lokal.ps1'
# benutzen weiterhin 'protokoll_assistent/requirements-anwendung.txt'.
# Hier stehen nur die Werkzeuge fuer Tests, Linting und die GitHub-Pipeline.
# ---------------------------------------------------------------------------
[project]
name = "lokaler-protokoll-assistent"
version = "0.2.0"
description = "Protokoll-Assistent: eine Windows-Anwendung (PySide6) fuer lokale und API-gestuetzte Transkription und Protokollauswertung"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = []

[dependency-groups]
dev = [
    # Laufzeitpakete, die zum Importieren der Module in Tests noetig sind.
    # Absichtlich OHNE torch/whisperx/pyannote: die richtet 'bootstrap.py' bei
    # Bedarf selbst ein und in den Tests werden sie durchgehend ueber
    # Parameter ersetzt.
    #
    # 'sv-ttk' und 'tkinterdnd2' standen hier fuer die tkinter-Oberflaeche.
    # Die ist mit der Zusammenfuehrung entfallen, die Pakete damit auch.
    "sounddevice>=0.4.6",
    "PySide6>=6.11.2,<7",
    "python-docx>=1.2.0",
    # Einziger Ort, an dem API-Schluessel optional dauerhaft gespeichert
    # werden koennen - ueber die Windows-Anmeldeinformationsverwaltung, nie
    # als Klartext-Datei (siehe 'services/secret_store.py').
    "keyring>=25.0",
    # Wird fuer den Windows-Build und dessen Probelauf in der CI gebraucht.
    "pyinstaller>=6.22.3",

    # Testwerkzeuge
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",

    # Qualitaet und Sicherheit
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.uv]
# Kein installierbares Paket - das Projekt wird als Ordner gestartet.
package = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# Es gibt genau EINE Anwendung, und sie ist ein echtes Paket: Alle Importe
# lauten 'protokoll_assistent.X.Y'. Damit genuegt die Projektwurzel im Pfad -
# die frueheren Zusatzeintraege fuer bare Importe ('from services import ...')
# sind mit der Vereinheitlichung entfallen.
pythonpath = ["."]
testpaths = ["protokoll_assistent/tests"]
# "--capture=sys": Nur sys.stdout/stderr werden ersetzt, die
# Dateideskriptoren bleiben intakt. Qt-Fenstertests vertragen das deutlich
# besser als ein Abfangen auf Deskriptorebene.
addopts = "-q --strict-markers --strict-config --capture=sys --timeout=120"
markers = [
    "gui: Test braucht eine echte Fensterumgebung (tkinter oder Qt)",
]
filterwarnings = ["error::DeprecationWarning:services.*", "error::DeprecationWarning:utils.*"]

# ---------------------------------------------------------------------------
# Testabdeckung
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
# Alles messen und nur gezielt ausnehmen. Eine Liste einzelner Dateien waere
# hier falsch: coverage deutet Eintraege, die keine Ordner sind, als
# Modulnamen - Dateien wie 'Modelle-herunterladen.py' fielen dabei stillschweigend
# aus der Messung heraus.
source = ["."]
omit = [
    "*/tests/*",
    "*/.venv/*",
    "*/.venv-*/*",
    "*/build/*",
    "*/dist/*",
    "*/__init__.py",
    "*/conftest.py",
    "*/protokoll_assistent.spec",
]
relative_files = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    '@(abc\.)?abstractmethod',
]

# ---------------------------------------------------------------------------
# Ruff (Linting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["protokoll_assistent/tools"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes - echte Fehler: ungenutzte Namen, Tippfehler
    "I",         # isort - Importreihenfolge
    "UP",        # pyupgrade
    "B",         # bugbear - haeufige Fallstricke
    "S",         # bandit - Sicherheitsregeln
    "PTH",       # os.path -> pathlib
    "RUF",       # ruff-spezifisch
]
ignore = [
    "E501",      # Zeilenlaenge: 'ruff format' kuemmert sich darum, wenn gewuenscht
    "B008",      # Funktionsaufruf im Default-Argument
    "RUF001",    # deutsche Umlaute/Sonderzeichen in Strings sind Absicht
    "RUF002",
    "RUF003",
    # Der Code ruft externe Programme grundsaetzlich mit Argumentlisten auf
    # (nie 'shell=True') - genau das ist die sichere Variante. S603 meldet
    # aber jeden subprocess-Aufruf, auch den richtigen.
    "S603",
    # 'ffmpeg'/'ollama' werden absichtlich ueber den PATH gesucht, damit eine
    # vom Anwender installierte Version benutzt wird.
    "S607",
    # Alle Aufrufe gehen an https-Konstanten, an localhost (Ollama) oder an
    # einen vom Anwender eingetragenen Endpunkt. Letzterer wird vor dem
    # Aufruf auf http/https geprueft (siehe 'pruefe_endpunkt_schema').
    "S310",
    # Einige '# noqa'-Kommentare begruenden auf Deutsch, warum eine Stelle so
    # aussieht, wie sie aussieht. Die bleiben stehen, auch wenn die Regel
    # gerade nicht aktiv ist.
    "RUF100",
]

[tool.ruff.lint.isort]
# Ohne diese Liste haelt ruff die eigenen Pakete fuer Fremdpakete und sortiert
# sie zwischen PySide6 und Co. ein.
known-first-party = ["protokoll_assistent"]

[tool.ruff.lint.per-file-ignores]
# In Tests sind assert, Zufallswerte und harte Pfade voellig in Ordnung.
"**/tests/*" = ["S101", "S105", "S106", "S108", "S311", "PTH"]
# Diese beiden Dateien pruefen, ob der Anwender ueberhaupt eine passende
# Python-Version hat - sie laufen also absichtlich auch unter aelteren
# Interpretern als 3.10. UP036 wuerde genau diese Pruefung wegoptimieren.
"protokoll_assistent/bootstrap.py" = ["UP036"]

# ---------------------------------------------------------------------------
# mypy (Typpruefung)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["."]
# Tests uebergeben absichtlich falsche Typen, um Fehlerpfade zu pruefen -
# eine Typpruefung waere dort nur Laerm.
#
# 'dist[^/]*' deckt alle Build-Ordner ab: 'dist', 'dist-probe',
# 'dist-installer' und 'dist-python'. Letzterer enthaelt die
# heruntergeladene Python-Standardbibliothek fuer den Installer - ohne
# diesen Ausschluss bricht mypy dort ab ("A user-defined top-level module
# with name 'types' is not supported").
exclude = ['(^|/)(\.venv|build|dist[^/]*|tests)/']
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Bewusst NICHT gesetzt:
#   warn_unused_ignores - die '# type: ignore' an den torch/whisperx-Importen
#     werden in der echten '.venv-whisperx' gebraucht, hier fehlen die Pakete.
#   warn_unreachable - der Code prueft absichtlich Typen von JSON-Antworten
#     nach ("if not isinstance(daten, dict)"). Genau diese Vorsicht wuerde
#     als "nicht erreichbar" gemeldet werden.

[[tool.mypy.overrides]]
# PySide6 liefert unvollstaendige Typinformationen: Kurzschreibweisen wie
# 'Qt.red' oder 'QDialogButtonBox.Save' funktionieren zur Laufzeit, fehlen
# aber in den Stubs.
module = ["protokoll_assistent.gui.*"]
disable_error_code = ["attr-defined"]
