name: Naechtlicher Lauf

# Jede Nacht um 02:30 UTC (03:30/04:30 deutscher Zeit).
#
# Zweck: Dinge finden, die ohne Code-Aenderung kaputtgehen -
#   * neu veroeffentlichte Sicherheitsluecken in Abhaengigkeiten,
#   * ein PyInstaller-Build, der nicht mehr durchlaeuft.
#
# Damit kein Kontingent fuer nichts verbraucht wird, entfaellt der Build, wenn
# sich seit dem letzten erfolgreichen naechtlichen Lauf nichts ausser
# Dokumentation geaendert hat. Die Schwachstellenpruefung laeuft trotzdem - die
# ist billig (Linux) und genau dann interessant, wenn sich am Code nichts
# geaendert hat.
#
# Keine eigenen Tests mehr: Jeder Commit auf 'main' ist beim Push bereits von
# ci.yml getestet worden (Python 3.10 UND 3.11, mit demselben uv.lock). Ein
# zweiter Lauf hier haette genau dasselbe noch einmal geprueft.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      trotzdem_bauen:
        description: "Build auch ohne neue Commits ausfuehren"
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  aenderungen_pruefen:
    name: Gab es neue Commits?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # um den letzten erfolgreichen Lauf nachzuschlagen
    outputs:
      neue_commits: ${{ steps.pruefung.outputs.neue_commits }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Verglichen wird mit dem Stand des letzten ERFOLGREICHEN naechtlichen
      # Laufs, nicht mit "den letzten 24 Stunden": GitHub startet geplante
      # Laeufe oft Stunden zu spaet (gemessen im Oktober 2026: 4,5 bis 7 h
      # nach 02:30 UTC). Mit einem festen 24-Stunden-Fenster rutschte ein
      # Commit durch, wenn der naechste Lauf spaeter startete als der vorige.
      # Schlug der letzte Lauf fehl, wird gegen den davor verglichen - der
      # Build kommt dann also erneut. Im Zweifel wird gebaut.
      - id: pruefung
        env:
          GH_TOKEN: ${{ github.token }}
          TROTZDEM: ${{ inputs.trotzdem_bauen }}
        run: |
          set -uo pipefail
          if [ "$TROTZDEM" = "true" ]; then
            echo "Manuell angefordert - Build laeuft."
            echo "neue_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VORHER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?status=success&branch=main&per_page=1" \
                     --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true)
          neue=true
          if [ -n "$VORHER" ] && git cat-file -e "$VORHER^{commit}" 2>/dev/null; then
            # Reine Dokumentation loest keinen Build aus (wie in ci.yml).
            if rest=$(git diff --name-only "$VORHER" HEAD -- . \
                  ':(exclude)*.md' ':(exclude)research' ':(exclude)lizenzen' ':(exclude)LICENSE') \
               && [ -z "$rest" ]; then
              neue=false
            fi
          fi
          if [ "$neue" = "true" ]; then
            echo "Code geaendert seit ${VORHER:-(kein frueherer Lauf)} - Build laeuft."
          else
            echo "Seit $VORHER nichts ausser Dokumentation geaendert - Build wird uebersprungen."
          fi
          echo "neue_commits=$neue" >> "$GITHUB_OUTPUT"

  schwachstellen:
    name: Taegliche Schwachstellenpruefung
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --python 3.11

      - name: pip-audit
        run: |
          uv export --quiet --format requirements-txt --no-hashes --no-emit-project > abhaengigkeiten.txt
          uv run pip-audit --requirement abhaengigkeiten.txt --strict
          uv run pip-audit \
            --requirement protokoll_assistent/requirements-anwendung.txt

  installer:
    name: Installer bauen (Artefakt zum Ausprobieren)
    needs: aenderungen_pruefen
    if: needs.aenderungen_pruefen.outputs.neue_commits == 'true'
    runs-on: windows-latest
    # Normal gut vier Minuten.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --python 3.11

      - name: Anwendung bauen
        # WhisperX/PyTorch/pyannote werden hier absichtlich NICHT installiert:
        # sie sind mehrere Gigabyte gross und brauchen eine GPU-Umgebung. Die
        # Spezifikationsdatei verkraftet fehlende Pakete (siehe das try/except
        # um 'collect_all'). Dieser Lauf beantwortet deshalb genau eine Frage:
        # Laeuft der Build ueberhaupt noch durch, oder ist die Spezifikation/
        # ein Import kaputt?
        run: uv run pyinstaller --noconfirm protokoll_assistent.spec

      - name: Ist eine EXE entstanden?
        shell: pwsh
        run: |
          $exe = "dist\Protokoll-Assistent\Protokoll-Assistent.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Der Build hat keine EXE erzeugt: $exe"
            exit 1
          }
          Write-Host "Build erfolgreich: $exe"

      - name: Python-Laufzeitumgebung fuer den Installer holen
        # Damit Anwender kein Python selbst installieren muessen.
        shell: pwsh
        run: pwsh -NoProfile -File installer/python-laufzeit-holen.ps1

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress --yes

      - name: Installer uebersetzen
        shell: pwsh
        run: |
          # Naechtliche Builds bekommen bewusst eine Version, die man nicht
          # mit einem Release verwechseln kann.
          $version = "0.0.0-nightly-$(Get-Date -Format yyyyMMdd)"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe nicht gefunden: $iscc"
            exit 1
          }
          & $iscc "/DMeineVersion=$version" "installer\protokoll-assistent.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ergebnis pruefen
        shell: pwsh
        run: |
          $setup = "dist-installer\Protokoll-Assistent-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "Installer wurde nicht erzeugt: $setup"
            exit 1
          }
          $groesse = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Installer erstellt: $setup ($groesse MB)"

      - name: Als Artefakt ablegen
        # Bewusst nur ein Artefakt und kein Pre-Release: dieser Build ist von
        # niemandem ausprobiert worden. Herunterladen ueber die Seite des
        # Laufs unter "Actions".
        uses: actions/upload-artifact@v7
        with:
          name: Protokoll-Assistent-Setup-nightly
          path: dist-installer\*.exe
          retention-days: 14
