name: Release-Build

# Baut die Windows-Anwendung und haengt sie an ein GitHub-Release.
#
# Ausloeser: ein Tag der Form 'v1.2.3' - oder manuell ueber "Run workflow".
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Es entstehen ZWEI Dateien - beide aus demselben Build, seit es nur noch
# EINE Anwendung gibt:
#
#   Protokoll-Assistent-Setup-<Version>.exe   Installer fuer Anwender.
#       Enthaelt die gebaute Anwendung, die Programmdateien fuer den lokalen
#       Modus und eine mitgelieferte Python-Laufzeitumgebung. Installiert
#       ohne Administratorrechte pro Benutzer.
#
#   Protokoll-Assistent-windows.zip           Der reine PyInstaller-Build,
#       fuer Rechner, auf denen die Einrichtung schon gelaufen ist.
#
# WICHTIG: Der Build enthaelt keine KI-Modelle und kein PyTorch/WhisperX. Wer
# in den Einstellungen "Lokal" waehlt, laesst sich diese Umgebung beim ersten
# Start selbst einrichten und braucht dafuer ein installiertes Python
# 3.10/3.11. Im reinen API-Modus wird davon nichts gebraucht.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # noetig, um das Release anzulegen

env:
  UV_FROZEN: "1"

jobs:
  bauen:
    # Frueher zwei Jobs (lokale Anwendung + Auswahlfenster/Cloud-Variante),
    # die zwei verschiedene Spezifikationen gebaut haben. Mit einer einzigen
    # Anwendung ist das ein Build - und ein Windows-Laeufer weniger.
    name: Anwendung, Archiv und Installer bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --python 3.11

      - name: Tests vor dem Build
        # Ein Release soll nie aus einem roten Stand entstehen.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: PyInstaller ausfuehren
        run: uv run pyinstaller --noconfirm protokoll_assistent.spec

      - name: Archiv packen
        shell: pwsh
        run: |
          $quelle = "dist\Protokoll-Assistent"
          if (-not (Test-Path $quelle)) {
            Write-Error "Build-Ergebnis fehlt: $quelle"
            exit 1
          }
          # Lizenzhinweise aus '_internal' nach oben holen, damit sie im
          # Archiv sofort sichtbar sind (LGPL-Pflicht, siehe NOTICES.md).
          Copy-Item "$quelle\_internal\NOTICES.md" $quelle -Force
          Copy-Item "$quelle\_internal\LICENSE"    $quelle -Force
          Copy-Item "$quelle\_internal\lizenzen"   $quelle -Recurse -Force
          foreach ($pflicht in @("NOTICES.md", "LICENSE", "lizenzen\lgpl-3.0.txt")) {
            if (-not (Test-Path (Join-Path $quelle $pflicht))) {
              Write-Error "Lizenzdatei fehlt im Build: $pflicht"
              exit 1
            }
          }
          Compress-Archive -Path "$quelle\*" -DestinationPath "Protokoll-Assistent-windows.zip"

      - name: Python-Laufzeitumgebung fuer den Installer holen
        # Damit Anwender fuer den lokalen Modus kein Python selbst
        # installieren muessen.
        shell: pwsh
        run: pwsh -NoProfile -File installer/python-laufzeit-holen.ps1

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress --yes

      - name: Installer uebersetzen
        shell: pwsh
        run: |
          # Version aus dem Tag ('v1.2.3' -> '1.2.3'). Ohne Tag (manueller
          # Lauf) entsteht ein klar erkennbarer Testbuild.
          $version = "0.0.0-test"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          Write-Host "Version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe nicht gefunden: $iscc"
            exit 1
          }
          & $iscc "/DMeineVersion=$version" "installer\protokoll-assistent.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ergebnis pruefen
        shell: pwsh
        run: |
          $setup = "dist-installer\Protokoll-Assistent-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "Installer wurde nicht erzeugt: $setup"
            exit 1
          }
          $groesse = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Installer erstellt: $setup ($groesse MB)"

      # ZWEI Artefakte, nicht eines mit zwei Pfaden: Bei mehreren Pfaden
      # behaelt 'upload-artifact' die Ordnerstruktur ab dem gemeinsamen
      # Wurzelverzeichnis bei. Die EXE laege dann unter 'dist-installer/' und
      # das Dateimuster im Release-Schritt ('artefakte/Protokoll-Assistent-Setup-*.exe')
      # wuerde sie nicht mehr finden - das Release erschiene ohne Installer.
      - name: Archiv ablegen
        uses: actions/upload-artifact@v7
        with:
          name: Protokoll-Assistent-windows
          path: Protokoll-Assistent-windows.zip
          retention-days: 30

      - name: Installer ablegen
        uses: actions/upload-artifact@v7
        with:
          name: Protokoll-Assistent-Setup
          path: dist-installer\*.exe
          retention-days: 30

  veroeffentlichen:
    name: Release anlegen
    needs: [bauen]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Artefakte holen
        uses: actions/download-artifact@v8
        with:
          path: artefakte
          merge-multiple: true

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artefakte/Protokoll-Assistent-Setup-*.exe
            artefakte/Protokoll-Assistent-windows.zip
          generate_release_notes: true
          body: |
            ## Was Sie herunterladen sollten

            **`Protokoll-Assistent-Setup-*.exe`** - der Installer. Installiert
            ohne Administratorrechte, legt einen Startmenue-Eintrag an und
            laesst sich normal ueber "Apps & Features" wieder entfernen.

            Die ZIP-Datei ist nur fuer Rechner gedacht, auf denen die
            Einrichtung bereits gelaufen ist.

            ## Hinweise zu diesem Build

            * Es gibt **eine** Anwendung fuer beide Wege. Ob Transkription und
              Nachbearbeitung lokal oder ueber eine API laufen, ist eine
              Einstellung im Programm - kein eigenes Programm mehr.
            * Enthaelt **keine** KI-Modelle und kein PyTorch/WhisperX. Wer den
              lokalen Modus waehlt, laesst sich diese Umgebung beim ersten
              Start selbst einrichten und braucht dafuer ein installiertes
              **Python 3.10 oder 3.11**. Im reinen API-Modus wird davon nichts
              gebraucht.
            * Der Installer ist **nicht signiert**. Windows SmartScreen meldet
              sich deshalb beim Start - ueber "Weitere Informationen" -
              "Trotzdem ausfuehren" laesst er sich starten.
            * Der Build wurde automatisch erstellt und **nicht** auf echter
              Hardware mit GPU getestet. Bitte vor der Weitergabe einmal lokal
              ausprobieren.
