name: Release-Build

# Baut die Windows-Anwendung und haengt sie an ein GitHub-Release.
#
# Ausloeser: ein Tag der Form 'v1.2.3' - oder manuell ueber "Run workflow".
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Ausgeliefert wird die NEUE Oberflaeche (ARCHITEKTUR.md):
#
#   VERMERK.exe          das Tauri-Fenster (oberflaeche/src-tauri, mit der
#                        eingebetteten Svelte-Oberflaeche aus oberflaeche/build)
#   dienst\              der Python-Dienst als One-Directory-Build
#                        (vermerk_dienst.spec -> vermerk-dienst.exe)
#
# Es entstehen ZWEI Dateien aus demselben Build:
#
#   VERMERK-Desktop-Setup-<Version>.exe   Installer fuer Anwender.
#       Enthaelt VERMERK.exe, den Dienst, die Programmdateien als Quelltext
#       fuer den lokalen Modus und eine mitgelieferte Python-Laufzeitumgebung.
#       Installiert ohne Administratorrechte pro Benutzer.
#
#   VERMERK-Desktop-windows.zip           Nur VERMERK.exe + Ordner 'dienst'
#       (+ Lizenzhinweise), fuer den reinen API-Modus.
#
# WICHTIG: Der Build enthaelt keine KI-Modelle und kein PyTorch/WhisperX. Wer
# in den Einstellungen "Lokal" waehlt, laesst sich diese Umgebung beim ersten
# Start selbst einrichten (mit dem Python aus dem Installer). Im reinen
# API-Modus wird davon nichts gebraucht.
#
# Vor dem Build: Tests, Versionspruefung (alle Versionsangaben und der Tag
# muessen uebereinstimmen). Nach dem Build: Rauchtest des GEBAUTEN Dienstes
# mit eingeschalteter Anmeldung (tools/dienst_rauchtest.py) - scheitert er,
# gibt es kein Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Optional: Version fuer ein Release ohne Tag-Push, z. B. 0.4.0-rc1.
          Der Tag 'v<Version>' wird dabei beim Veroeffentlichen angelegt.
          Leer lassen = nur bauen, kein Release.
        required: false
        default: ""

permissions:
  contents: write # noetig, um das Release anzulegen

env:
  UV_FROZEN: "1"

jobs:
  bauen:
    # Frueher zwei Jobs (lokale Anwendung + Auswahlfenster/Cloud-Variante),
    # die zwei verschiedene Spezifikationen gebaut haben. Mit einer einzigen
    # Anwendung ist das ein Build - und ein Windows-Laeufer weniger.
    name: Anwendung, Archiv und Installer bauen
    runs-on: windows-latest
    # Tests plus Build plus Installer; ein haengender Schritt soll den Laeufer
    # nicht die Vorgabe von sechs Stunden belegen.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --python 3.11

      - name: Versionen pruefen
        # pyproject.toml, version.py, package.json, tauri.conf.json, Cargo.toml
        # und - bei einem Tag oder einer Versionseingabe - der Tag selbst.
        shell: pwsh
        env:
          EINGABE_VERSION: ${{ inputs.version }}
        run: |
          $tag = ""
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:EINGABE_VERSION) {
            $tag = "v$($env:EINGABE_VERSION)"
          }
          if ($tag) {
            uv run python tools/versionen_pruefen.py $tag
          } else {
            uv run python tools/versionen_pruefen.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Tests vor dem Build
        # Ein Release soll nie aus einem roten Stand entstehen.
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --junitxml=testergebnis.xml

      - name: Testergebnis zusammenfassen
        # Wie in ci.yml: fehlgeschlagene Tests mit Name und Meldung in der
        # Zusammenfassung des Laufs und als Annotation.
        if: always()
        run: uv run python -m protokoll_assistent.tools.testergebnis_zusammenfassen testergebnis.xml "Tests vor dem Build"

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oberflaeche/package-lock.json

      - name: Oberflaeche bauen
        # Alle Werkzeuge aus package-lock.json, nichts aus einem CDN.
        working-directory: oberflaeche
        run: |
          npm ci
          npm run build

      - name: Rust einrichten
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fenster bauen (VERMERK.exe)
        # Ohne Bundler (Inno Setup bleibt der Installer). 'tauri/custom-protocol'
        # bettet oberflaeche/build ein - ohne das Merkmal luede die EXE die Seite
        # vom Entwicklungsserver.
        working-directory: oberflaeche/src-tauri
        run: cargo build --release --locked --features tauri/custom-protocol

      - name: Dienst bauen (PyInstaller)
        run: uv run pyinstaller --noconfirm vermerk_dienst.spec

      - name: Rauchtest des gebauten Dienstes
        # Startet dist/vermerk-dienst/vermerk-dienst.exe zweimal mit --port 0,
        # Portdatei und Schluessel und prueft Gesundheit, Anmeldung (401/200)
        # und die Host-Pruefung. Scheitert er, gibt es kein Release.
        run: uv run python tools/dienst_rauchtest.py dist/vermerk-dienst/vermerk-dienst.exe

      - name: Archiv packen
        shell: pwsh
        run: |
          $fenster = "oberflaeche\src-tauri\target\release\VERMERK.exe"
          $dienst = "dist\vermerk-dienst"
          foreach ($pflicht in @($fenster, "$dienst\vermerk-dienst.exe")) {
            if (-not (Test-Path $pflicht)) {
              Write-Error "Build-Ergebnis fehlt: $pflicht"
              exit 1
            }
          }
          # Ordner, die ein Start des Dienstes anlegen kann (Rauchtest), gehoeren
          # nicht in Archiv und Installer.
          foreach ($rest in @("einstellungen", "logs", "ausgabe", "aufnahmen", "arbeitsdaten", "sprecherprofile", "chatverlaeufe", "zwischenstaende")) {
            Remove-Item (Join-Path $dienst $rest) -Recurse -Force -ErrorAction SilentlyContinue
          }
          $ziel = "dist\VERMERK"
          New-Item -ItemType Directory -Force $ziel | Out-Null
          Copy-Item $fenster $ziel -Force
          Copy-Item $dienst (Join-Path $ziel "dienst") -Recurse -Force
          Copy-Item "NOTICES.md" $ziel -Force
          Copy-Item "LICENSE"    $ziel -Force
          Copy-Item "lizenzen"   $ziel -Recurse -Force
          foreach ($pflicht in @("VERMERK.exe", "dienst\vermerk-dienst.exe", "NOTICES.md", "LICENSE")) {
            if (-not (Test-Path (Join-Path $ziel $pflicht))) {
              Write-Error "Datei fehlt im Archiv: $pflicht"
              exit 1
            }
          }
          foreach ($datei in @("$ziel\VERMERK.exe", "$ziel\dienst\vermerk-dienst.exe")) {
            $mb = [math]::Round((Get-Item $datei).Length / 1MB, 1)
            Write-Host "$datei ($mb MB)"
          }
          Compress-Archive -Path "$ziel\*" -DestinationPath "VERMERK-Desktop-windows.zip"

      - name: Python-Laufzeitumgebung fuer den Installer holen
        # Damit Anwender fuer den lokalen Modus kein Python selbst
        # installieren muessen.
        shell: pwsh
        run: pwsh -NoProfile -File installer/python-laufzeit-holen.ps1

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress --yes

      - name: Installer uebersetzen
        shell: pwsh
        env:
          EINGABE_VERSION: ${{ inputs.version }}
        run: |
          # Version aus dem Tag ('v1.2.3' -> '1.2.3'), sonst aus der Eingabe
          # des manuellen Laufs. Ohne beides entsteht ein klar erkennbarer
          # Testbuild.
          $version = "0.0.0-test"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:EINGABE_VERSION -match '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            $version = $env:EINGABE_VERSION
          }
          Write-Host "Version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe nicht gefunden: $iscc"
            exit 1
          }
          & $iscc "/DMeineVersion=$version" "installer\protokoll-assistent.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ergebnis pruefen
        shell: pwsh
        run: |
          $setup = "dist-installer\VERMERK-Desktop-Setup-$env:VERSION.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "Installer wurde nicht erzeugt: $setup"
            exit 1
          }
          $groesse = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "Installer erstellt: $setup ($groesse MB)"

      # ZWEI Artefakte, nicht eines mit zwei Pfaden: Bei mehreren Pfaden
      # behaelt 'upload-artifact' die Ordnerstruktur ab dem gemeinsamen
      # Wurzelverzeichnis bei. Die EXE laege dann unter 'dist-installer/' und
      # das Dateimuster im Release-Schritt ('artefakte/VERMERK-Desktop-Setup-*.exe')
      # wuerde sie nicht mehr finden - das Release erschiene ohne Installer.
      - name: Archiv ablegen
        uses: actions/upload-artifact@v7
        with:
          name: VERMERK-Desktop-windows
          path: VERMERK-Desktop-windows.zip
          retention-days: 30

      - name: Installer ablegen
        uses: actions/upload-artifact@v7
        with:
          name: VERMERK-Desktop-Setup
          path: dist-installer\*.exe
          retention-days: 30

  veroeffentlichen:
    name: Release anlegen
    needs: [bauen]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Artefakte holen
        uses: actions/download-artifact@v8
        with:
          path: artefakte
          merge-multiple: true

      - name: Release anlegen
        uses: softprops/action-gh-release@v3
        with:
          # Bei einem Tag-Push gilt der Tag; bei einem manuellen Lauf mit
          # Versionseingabe legt dieser Schritt den Tag am gebauten Stand an.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            artefakte/VERMERK-Desktop-Setup-*.exe
            artefakte/VERMERK-Desktop-windows.zip
          generate_release_notes: true
          # Ein Tag mit Bindestrich ('v0.4.0-rc1') ist ein Testrelease und darf
          # nicht als "neueste Version" erscheinen.
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.version, '-') }}
          body: |
            ## Was Sie herunterladen sollten

            **`VERMERK-Desktop-Setup-*.exe`** - der Installer. Installiert
            ohne Administratorrechte, legt einen Startmenue-Eintrag an und
            laesst sich normal ueber "Apps & Features" wieder entfernen.

            Die ZIP-Datei (VERMERK.exe + Ordner `dienst`) taugt nur fuer den
            reinen API-Modus.

            ## Hinweise zu diesem Build

            * Neue Oberflaeche: `VERMERK.exe` ist ein Fenster auf Basis von
              Tauri und Microsoft Edge WebView2 (unter Windows 10/11
              vorinstalliert), der Dienst laeuft im Hintergrund mit.
            * Es gibt **eine** Anwendung fuer beide Wege. Ob Transkription und
              Nachbearbeitung lokal oder ueber eine API laufen, ist eine
              Einstellung im Programm - kein eigenes Programm mehr.
            * Enthaelt **keine** KI-Modelle und kein PyTorch. Wer den lokalen
              Modus waehlt, laesst sich diese Umgebung nach Zustimmung von der
              Anwendung einrichten (rund 5 GB Download); der Installer bringt
              das dafuer noetige Python mit. Nur die ZIP-Datei hat es nicht
              dabei - sie taugt deshalb allein fuer den API-Modus. Im reinen
              API-Modus wird davon nichts gebraucht.
            * Der Installer ist **nicht signiert**. Windows SmartScreen meldet
              sich deshalb beim Start - ueber "Weitere Informationen" -
              "Trotzdem ausfuehren" laesst er sich starten.
            * Der Build wurde automatisch erstellt und **nicht** auf echter
              Hardware mit GPU getestet. Bitte vor der Weitergabe einmal lokal
              ausprobieren.
